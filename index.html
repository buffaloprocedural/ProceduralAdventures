<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Procedural Adventures</title>

<body>
<div id="console">
  <div id="bezel">
    <div id="bezel-top"><span class="bezel-label">Procedural Adventures</span></div>
    <div id="screen-wrap"><canvas id="screen" width="160" height="144"></canvas></div>
    <div id="bezel-brand"><span class="led" id="led" title="sound"></span><span class="status">Procedural <i>Adventures</i></span></div>
  </div>
  <div id="pad" aria-hidden="true">
    <div id="dpad">
      <button data-btn="up" class="d up"></button>
      <button data-btn="left" class="d left"></button>
      <button data-btn="right" class="d right"></button>
      <button data-btn="down" class="d down"></button>
      <div class="d mid"></div>
    </div>
    <div id="ab">
      <button data-btn="b" class="round b">B</button>
      <button data-btn="a" class="round a">A</button>
    </div>
    <div id="ss">
      <button data-btn="select" class="pill">SELECT</button>
      <button data-btn="start" class="pill">START</button>
    </div>
  </div>
  <div id="help">Arrows/WASD move &middot; Z/Space/Enter = A &middot; X/Backspace = B (hold to hurry) &middot; Enter/Esc = START &middot; Shift = SELECT &middot; M = mute &middot; F = fullscreen<br>Controller: d-pad/stick move &middot; bottom button = A &middot; right button = B &middot; Menu = START &middot; View = SELECT</div>
</div>
